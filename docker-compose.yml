version: "3.8"

services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: monk-scylla
    ports:
      - "9042:9042"
    command: --smp 1 --memory 512M --overprovisioned 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: .
    container_name: monk-api
    ports:
      - "8080:8080"
    depends_on:
      scylla:
        condition: service_healthy
    restart: on-failure
